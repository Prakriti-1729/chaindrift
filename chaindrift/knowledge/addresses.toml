# Well-known addresses whose meaning depends on the chain.
#
# on = ["chain", ...]  -> the address is only meaningful on these chains
# on = "*"            -> deployed at this address on most EVM chains, except those in `missing`
# missing_severity    -> severity used for chains in `missing` (default "high")
#
# Remember: a low-level call to an address with no code SUCCEEDS and returns no data,
# while a high-level Solidity call to it reverts.
#
# We deliberately do not list the "right" address on other chains for tokens and oracles:
# look those up in the issuer's official documentation instead of trusting a scanner.

